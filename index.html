<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141210">
<title>Boca2sushi | Carta digital</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍣</text></svg>">
<style>
:root{color-scheme:dark;--ink:#f3ece0;--mute:#b9a88e;--red:#e0573f;--ln:rgba(214,186,140,.2);--hh:110px;--ez:cubic-bezier(.32,.72,0,1);--serif:'Segoe UI',Montserrat,Roboto,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:repeating-linear-gradient(90deg,transparent 0 23px,rgba(130,95,45,.07) 23px 24px),repeating-linear-gradient(0deg,transparent 0 220px,rgba(130,95,45,.06) 220px 222px),linear-gradient(#1c1a17,#0e0d0b);padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
header{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:rgba(20,18,16,.88);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:11px;padding:10px 16px 8px}
.emb{height:36px;width:auto;display:block;flex:none}
.ag{font-size:12px;font-weight:700;color:var(--mute)}.card.off{opacity:.55}
.sc textarea{display:block;width:100%;margin-top:5px;padding:13px 14px;border:1px solid var(--ln);border-radius:14px;background:#2a2725;font:inherit;font-size:16px;resize:none}.sc textarea:focus{outline:2px solid var(--red)}
.mon{width:38px;height:38px;border-radius:11px;background:var(--red);color:#fff;display:grid;place-items:center;font:700 21px var(--serif);transform:rotate(-5deg);box-shadow:0 4px 10px -3px rgba(197,58,40,.6)}
.brand b{display:block;font:700 20px/1.1 var(--serif)}.brand small{color:var(--mute);font-size:12px}
nav{position:relative;display:flex;gap:8px;overflow-x:auto;padding:2px 14px 10px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:7px 14px;border-radius:99px;font-weight:600;font-size:13.5px;color:var(--mute);text-decoration:none;background:rgba(255,255,255,.05);border:1px solid var(--ln);transition:background .25s,color .25s,transform .3s var(--ez)}
nav a.on{background:var(--red);border-color:var(--red);color:#fff;transform:scale(1.05)}
.sec{max-width:560px;margin:0 auto;padding:20px 14px 2px;scroll-margin-top:var(--hh)}
.sec:last-child{min-height:calc(100vh - var(--hh))}
.sec h2{display:flex;align-items:center;gap:10px;font:700 23px/1.1 var(--serif);margin-bottom:12px}
.sec h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ln),transparent)}
.card{display:flex;gap:12px;padding:10px;margin-bottom:12px;background:rgba(34,31,28,.94);border:1px solid var(--ln);border-radius:20px;box-shadow:0 8px 20px -12px rgba(90,60,20,.45)}
.ph{position:relative;flex:none;width:106px;height:106px;border-radius:15px;overflow:hidden;display:grid;place-items:center;font-size:38px;cursor:zoom-in;background:linear-gradient(135deg,#2b3a2d,#1c251e);transition:transform .35s var(--ez)}
.ph:active{transform:scale(.95)}
.ph img,.lp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.ph img.ok,.lp img.ok{opacity:1}
.inf{flex:1;min-width:0;display:flex;flex-direction:column}
.inf h3{font-size:16px;line-height:1.2}
.inf p{margin-top:3px;font-size:12.5px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ft{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.pr{font-weight:800;font-size:17px;color:var(--red)}
.add{position:relative;width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center;box-shadow:0 6px 12px -4px rgba(197,58,40,.7);transition:transform .25s var(--ez)}
.add:active{transform:scale(.88)}
.add i{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--ink);font-size:11px;font-weight:700;font-style:normal;line-height:19px;text-align:center}
footer{text-align:center;color:var(--mute);font-size:12px;padding:16px}
.go{display:block;width:100%;padding:14px;border-radius:16px;background:var(--red);color:#fff;font-weight:700;text-align:center;text-decoration:none;box-shadow:0 10px 20px -8px rgba(197,58,40,.65);transition:transform .25s var(--ez)}
.go:active{transform:scale(.97)}
#bar{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;margin:0 auto;width:calc(100% - 28px);max-width:492px;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:20px;background:var(--red);color:#fff;font-weight:700;box-shadow:0 16px 32px -10px rgba(150,35,20,.7);transform:translateY(170%);transition:transform .55s var(--ez)}
#bar.on{transform:none}
#bar .n{min-width:28px;height:28px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font-size:14px}
#bar span:nth-child(2){flex:1;text-align:left}
.lay{position:fixed;inset:0;z-index:50;visibility:hidden;transition:visibility 0s .55s}
.lay.on{visibility:visible;transition-delay:0s}
.veil{position:absolute;inset:0;background:rgba(55,38,18,.32);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);opacity:0;transition:opacity .4s}
.on>.veil{opacity:1}
#lb{display:grid;place-items:center;padding:16px}
.lc{position:relative;width:100%;max-width:420px;max-height:92vh;overflow:auto;border-radius:30px;background:rgba(26,24,22,.92);-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);border:1px solid rgba(255,255,255,.75);box-shadow:0 40px 80px -24px rgba(50,30,8,.6);opacity:0;transform:translate(var(--dx,0),var(--dy,0)) scale(.25);transition:transform .55s var(--ez),opacity .3s;will-change:transform}
#lb.on .lc{opacity:1;transform:none}
.lp{position:relative;aspect-ratio:4/3;display:grid;place-items:center;font-size:90px;overflow:hidden;touch-action:none;background:linear-gradient(135deg,#2b3a2d,#1c251e)}
.x{position:absolute;top:12px;right:12px;z-index:2;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);font-size:20px;line-height:34px}
.lt{padding:18px 20px 20px}
.lt h3{font:700 22px/1.15 var(--serif)}
.lt .pr{display:block;margin:4px 0 8px;font-size:20px}
.lt p{color:#cfc3af}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.tags span{padding:4px 10px;border-radius:99px;background:rgba(224,87,63,.14);color:#f2a48f;font-size:12px;font-weight:600}
.row{display:flex;gap:12px;align-items:center}.row .go{flex:1}
.q{display:flex;align-items:center;gap:4px;padding:4px;border-radius:16px;background:rgba(120,90,50,.1)}
.q button{width:34px;height:34px;border-radius:12px;background:#3a342e;font-size:19px;font-weight:700;box-shadow:0 2px 6px -2px rgba(0,0,0,.2)}
.q b{min-width:26px;text-align:center}
.sc{position:absolute;left:0;right:0;bottom:0;margin:auto;max-width:520px;max-height:90vh;overflow:auto;padding:10px 18px calc(20px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:rgba(26,24,22,.97);transform:translateY(105%);transition:transform .55s var(--ez);will-change:transform}
#sh.on .sc{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:rgba(0,0,0,.18);margin:0 auto 12px}
.sc h2{font:700 22px var(--serif);margin-bottom:8px}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--ln)}
.li>div:first-child{flex:1;min-width:0}.li small{color:var(--mute)}.li>b{min-width:62px;text-align:right}
.li .q button{width:30px;height:30px}
.lbl{display:block;margin-top:14px;font-size:13px;font-weight:700;color:var(--mute)}
.sc input{display:block;width:100%;margin-top:5px;padding:13px 14px;border:1px solid var(--ln);border-radius:14px;background:#2a2725;font-size:16px}
.sc input:focus{outline:2px solid var(--red)}
.seg{display:flex;gap:6px;margin-top:5px;padding:4px;border-radius:16px;background:rgba(120,90,50,.1)}
.seg button{flex:1;padding:10px 6px;border-radius:12px;font-weight:600;font-size:13.5px;color:var(--mute);transition:background .25s,color .25s}
.seg button.on{background:#3a342e;color:var(--ink);box-shadow:0 2px 8px -2px rgba(0,0,0,.2)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 12px}.tot b{font-size:24px;color:var(--red)}
.fin{text-align:center;padding:10px 0}.fin .mon{margin:0 auto 12px}.fin p{margin:6px 0 16px}.fin .go{margin-bottom:8px}.fin button{padding:10px;color:var(--mute);font-weight:600}
.mx{cursor:grab;position:fixed;right:8px;bottom:96px;width:160px;height:160px;z-index:28;background:url(mascota_sheet.webp) no-repeat;background-size:1120px 800px;touch-action:none;user-select:none;-webkit-user-select:none;transform:translateX(130%);transition:transform .6s var(--ez);filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
#burbuja{position:fixed;right:10px;bottom:236px;max-width:70vw;background:#fff;color:#2a1f17;padding:8px 12px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transform:translateY(6px);transition:.25s;z-index:41;pointer-events:none}
#burbuja.on{opacity:1;transform:none}
.cor{position:fixed;color:#ff5e8a;font-size:22px;z-index:40;pointer-events:none;animation:subir 1s ease-out forwards}
@keyframes subir{to{transform:translateY(-60px);opacity:0}}
.mx.in{transform:none;animation:respira 2.2s ease-in-out infinite}
@keyframes respira{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965) translateY(-2px)}}
.mic{position:fixed;left:12px;bottom:96px;width:46px;height:46px;border-radius:50%;border:0;background:#e0573f;color:#fff;font-size:20px;z-index:29;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.mic.rec{background:#8f2c1d;animation:pulso 1s infinite}
@keyframes pulso{50%{transform:scale(1.12)}}
.mx.in.quieta{animation:none}
.mas{display:block;height:170px;width:auto;margin:0 auto 10px;animation:bob 2.6s ease-in-out infinite}
@keyframes manejar{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-4px) rotate(-1.5deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-4px) rotate(1.5deg)}}
.mas.moto{animation:manejar .7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes kb{0%{transform:scale(1.2) translate(-4%,3%)}100%{transform:scale(1) translate(0,0)}}
#lm.ok{animation:kb 3s var(--ez) both}
.lp{perspective:800px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}html{scroll-behavior:auto}}
</style>
</head>

<div id="mx" class="mx"></div>
<div id="burbuja"></div>
<button id="mic" class="mic" aria-label="Repetir mi voz">🎤</button>

function audioCtx(){ if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}} if(actx.state==='suspended')actx.resume(); return actx }
/* Balbuceo sintetizado (sin archivos): tonos cortos y variados como Talking Tom */
function babble(ms=1000,tono={base:600,v:1}){
  const c=audioCtx(); if(!c)return;
  const n=Math.max(4,Math.round(ms/110)); let tt=c.currentTime;
  for(let i=0;i<n;i++){
    const o=c.createOscillator(), g=c.createGain(); o.type='sine';
    const f=tono.base*(0.75+Math.random()*0.8*tono.v);
    o.frequency.setValueAtTime(f,tt); o.frequency.exponentialRampToValueAtTime(f*(0.75+Math.random()*0.6),tt+0.09);
    g.gain.setValueAtTime(0,tt); g.gain.linearRampToValueAtTime(0.16,tt+0.02); g.gain.linearRampToValueAtTime(0,tt+0.1);
    o.connect(g).connect(c.destination); o.start(tt); o.stop(tt+0.11); tt+=0.11;
  }
  const id=setInterval(()=>mx.animate([{transform:'scale(1,1)'},{transform:'scale(1.05,.95)'},{transform:'scale(1,1)'}],{duration:220}),230);
  setTimeout(()=>clearInterval(id),ms);
}

 $('#le').textContent=cur.ico;m.classList.remove('ok');m.hidden=!s;s?m.src=s:m.removeAttribute('src');
 $('#ln').textContent=cur.n;$('#lpr').textContent=fmt(cur.p);$('#ld').textContent=cur.d;
 $('#lg').innerHTML=cur.ing.map(x=>`<span>${x}</span>`).join('');
 lbq();$('#la').hidden=!!cur.off;lb.classList.add('on');lock()
}
$('#lm').onload=e=>e.target.classList.add('ok');$('#lm').onerror=e=>e.target.hidden=true;
$('#lv').onclick=$('#xb').onclick=closeLb;
$('#lmi').onclick=()=>{q=Math.max(1,q-1);lbq()};
$('#lpl').onclick=()=>{q=Math.min(20,q+1);lbq()};
$('#la').onclick=()=>{add(cur.id,q);closeLb()};
lp.ontouchstart=e=>{ty=e.touches[0].clientY;lc.style.transition='none'};
lp.ontouchmove=e=>{const d=Math.max(0,e.touches[0].clientY-ty);lc.style.transform=`translateY(${d}px) scale(${1-d/1400})`};
lp.ontouchend=e=>{const d=e.changedTouches[0].clientY-ty;lc.style.transition='';lc.style.transform='';if(d>90)closeLb()};
$('#menu').onclick=e=>{const a=e.target.closest('[data-a]');if(!a)return;const c=a.closest('.card');a.dataset.a=='add'?add(c.dataset.id,1):openLb(c.dataset.id,c.querySelector('.ph'))};

/* ===== Pedido y WhatsApp ===== */
const cli=ls.get('bs_cli')||{};fm.n.value=cli.n||'';fm.d.value=cli.d||'';
$('#bar').onclick=()=>{$('#s1').hidden=false;$('#s2').hidden=true;sh.classList.add('on');lock()};
$('#sv').onclick=$('#nw').onclick=closeSh;
$('#ci').onclick=e=>{const b=e.target.closest('[data-a]');if(b)add(b.closest('.li').dataset.id,b.dataset.a=='p'?1:-1)};
document.querySelectorAll('.seg').forEach(s=>s.onclick=e=>{
 const b=e.target.closest('button');if(!b)return;
 s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));sel[s.dataset.k]=b.dataset.v;
 if(s.dataset.k=='e'){const dv=b.dataset.v=='Delivery';$('#ad').hidden=!dv;fm.d.required=dv}
});
const msg=(c,f)=>[`🍣 *${cfg.nombre}* | Pedido *${c}*`,'',`👤 *Cliente:* ${f.n}`,`📦 *Entrega:* ${f.e}`,...(f.e=='Delivery'?[`📍 *Dirección:* ${f.d}`]:[]),`💳 *Pago:* ${f.p}`,...(f.c?['📝 *Comentarios:* '+f.c]:[]),'','*Detalle:*',...Object.keys(cart).map(k=>`• ${cart[k]} × ${items[k].n}: ${fmt(items[k].p*cart[k])}`),'',`💰 *Total:* ${fmt(tot())}${f.e=='Delivery'?' (+ envío por confirmar)':''}`,'','¡Gracias! 🙌'].join('\n');
fm.onsubmit=e=>{
 e.preventDefault();
 if(cfg.whatsapp.replace(/\D/g,'').length<11){alert('Falta configurar el número de WhatsApp del local.');return}
 const f={n:fm.n.value.trim(),d:fm.d.value.trim(),e:sel.e,p:sel.p,c:fm.c.value.trim()},c=code(),u=`https://wa.me/${cfg.whatsapp.replace(/\D/g,'')}?text=${encodeURIComponent(msg(c,f))}`;
 ls.set('bs_cli',{n:f.n,d:f.d});
 $('#oc').textContent=c;$('#wl').href=u;$('#s1').hidden=true;$('#s2').hidden=false;
 cart={};upd();reaccion('enviar');
 window.open(u,'_blank')||(location.href=u)
};
addEventListener('keydown',e=>{if(e.key=='Escape'){closeLb();closeSh()}});

/* ===== ScrollSpy ===== */
const H=()=>{const h=hd.offsetHeight;document.documentElement.style.setProperty('--hh',h+'px');return h};
const setOn=id=>nav.querySelectorAll('a').forEach(a=>{const on=a.dataset.c==id;a.classList.toggle('on',on);if(on)nav.scrollTo({left:a.offsetLeft-(nav.clientWidth-a.offsetWidth)/2,behavior:'smooth'})});
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&!busy&&setOn(e.target.id)),{rootMargin:`-${H()+2}px 0px -70% 0px`});
document.querySelectorAll('.sec').forEach(s=>io.observe(s));
nav.onclick=e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();busy=1;setOn(a.dataset.c);clearTimeout(tm);tm=setTimeout(()=>busy=0,900);document.getElementById(a.dataset.c).scrollIntoView({behavior:'smooth'})};
setOn(MENU.categorias[0].id);
upd();
setTimeout(()=>{mx.classList.add('in');decir('こんにちは','¡Hola!')},900);
})();

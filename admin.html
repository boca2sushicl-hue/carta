<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Carta</title>
<style>
body{font:15px/1.4 system-ui,sans-serif;margin:0;background:#1c1a17;color:#f3ece0;padding:10px 10px 90px}
h1{font-size:19px;margin:4px 0 8px}
.box{background:#2a2622;border:1px solid rgba(214,186,140,.2);border-radius:12px;padding:8px;margin-bottom:8px}
label{display:block;font-size:12px;font-weight:700;color:#b9a88e;margin-top:6px}
input,textarea{width:100%;padding:8px;border:1px solid #4a4238;border-radius:8px;font:inherit;font-size:15px;background:#1c1a17;color:#f3ece0;margin-top:3px;box-sizing:border-box}
.r{display:flex;gap:8px;align-items:flex-end}.r>div{flex:1}
.ck{display:flex;align-items:center;gap:6px;font-size:14px}.ck input{width:auto;margin:0}
button{padding:9px 12px;border-radius:10px;border:0;background:#e0573f;color:#fff;font-weight:700;font-size:14px}
button.g{background:#3a342e;color:#f3ece0;width:100%;margin-top:6px}button.d{background:#1c1a17;color:#f2a48f;border:1px solid #e0573f}
.cab{width:100%;text-align:left;background:none;color:#f3ece0;font-size:16px;padding:6px 2px;display:flex;justify-content:space-between}
.cab small{color:#b9a88e;font-weight:600}
.fila{display:flex;align-items:center;gap:8px;padding:10px 4px;border-top:1px dashed rgba(214,186,140,.2);cursor:pointer}
.fila .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila em{color:#f2a48f;font-style:normal;font-size:12px}
.fila b{color:#e0573f}
.fila .ed{color:#b9a88e;font-size:13px}
.det{padding:4px 2px 8px}
#save{position:fixed;left:10px;right:10px;bottom:10px;padding:14px;font-size:16px;box-shadow:0 10px 20px -8px rgba(224,87,63,.6)}
#msg{font-size:13px;color:#b9a88e;margin:6px 0;min-height:18px}
</style></head><body>
<h1>Editar carta</h1>
<div class="box">
 <label>Clave de administrador<input id="clave" type="password"></label>
 <label>Nombre del local<input id="nom"></label>
 <label>WhatsApp del local (56 + número, solo dígitos)<input id="wa"></label>
</div>
<div id="cats"></div>
<button class="g" id="nuevaCat">+ Nueva categoría</button>
<div id="msg"></div>
<button id="save">Guardar cambios</button>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbxAOQ8qjUIFR5jiiSzPT3wYiXmx-KYQOtLd-esCaMI1LB5AP0l-drik8gzA38HvLa_p/exec';
let M=null;
const CAT=new Set(), PROD=new Set();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);

async function cargar(){
  try{const j=await (await fetch(API_URL)).json(); if(j.categorias){M=j;return}}catch(e){}
  const t=await (await fetch('index.html')).text();
  M=new Function('return '+t.match(/const MENU0=(\{[\s\S]*?\]\});/)[1])();
}

function pintar(){
  $('wa').value=M.config.whatsapp;
  $('nom').value=M.config.nombre||'';
  $('cats').innerHTML=M.categorias.map((c,ci)=>{
    const abierta=CAT.has(c.id);
    return `<div class="box">
      <button class="cab" data-cat="${c.id}">${esc(c.ico)} ${esc(c.nombre)} <small>${c.items.length} ${abierta?'▲':'▼'}</small></button>
      ${abierta?c.items.map((i,ii)=>{
        const ed=PROD.has(i.id);
        return `<div>
          <div class="fila" data-prod="${i.id}"><span class="nm">${esc(i.n)}${i.ag?' <em>(agotado)</em>':''}</span><b>$${i.p}</b><span class="ed">${ed?'▲':'✏️'}</span></div>
          ${ed?`<div class="det">
            <div class="r"><div><label>Nombre<input data-k="n" data-c="${ci}" data-i="${ii}" value="${esc(i.n)}"></label></div>
            <div style="flex:0 0 100px"><label>Precio<input type="number" data-k="p" data-c="${ci}" data-i="${ii}" value="${i.p}"></label></div></div>
            <label>Ingredientes (separados por coma)<input data-k="ing" data-c="${ci}" data-i="${ii}" value="${esc(i.ing.join(', '))}"></label>
            <label>Descripción<textarea rows="2" data-k="d" data-c="${ci}" data-i="${ii}">${esc(i.d)}</textarea></label>
            <label>Foto (enlace de Google Drive, opcional)<input data-k="img" data-c="${ci}" data-i="${ii}" value="${esc(i.img)}"></label>
            <div class="r" style="margin-top:8px;align-items:center">
              <label class="ck"><input type="checkbox" data-k="ag" data-c="${ci}" data-i="${ii}" ${i.ag?'checked':''}> Agotado</label>
              <span style="flex:1"></span>
              <button class="d" data-del="${ci}-${ii}">Eliminar</button></div>
          </div>`:''}
        </div>`}).join('')+`<button class="g" data-add="${ci}">+ Producto en ${esc(c.nombre)}</button>`:''}
    </div>`}).join('');
}

$('cats').addEventListener('input',e=>{
  const t=e.target; if(!t.dataset.k)return;
  const i=M.categorias[t.dataset.c].items[t.dataset.i], k=t.dataset.k;
  i[k]=k=='p'?Number(t.value):k=='ing'?t.value.split(',').map(s=>s.trim()).filter(Boolean):k=='ag'?t.checked:t.value;
});
$('cats').addEventListener('click',e=>{
  const cat=e.target.closest('[data-cat]');
  if(cat){const id=cat.dataset.cat; CAT.has(id)?CAT.delete(id):CAT.add(id); pintar(); return}
  const pr=e.target.closest('[data-prod]');
  if(pr){const id=pr.dataset.prod; PROD.has(id)?PROD.delete(id):PROD.add(id); pintar(); return}
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.add!==undefined){
    const c=M.categorias[b.dataset.add], nid='n'+Date.now();
    c.items.push({id:nid,n:'Nuevo producto',p:0,ing:[],d:'',img:'',ag:false});
    PROD.add(nid); pintar(); return;
  }
  if(b.dataset.del!==undefined&&confirm('¿Eliminar este producto?')){
    const [c,i]=b.dataset.del.split('-'); M.categorias[c].items.splice(i,1); pintar();
  }
});
$('nuevaCat').onclick=()=>{const n=prompt('Nombre de la categoría');if(!n)return;const id='c'+Date.now();M.categorias.push({id,nombre:n,ico:'🍽️',items:[]});CAT.add(id);pintar()};
$('wa').oninput=e=>M.config.whatsapp=e.target.value.replace(/\D/g,'');
$('nom').oninput=e=>M.config.nombre=e.target.value;

$('save').onclick=async()=>{
  const m=$('msg');m.textContent='Guardando…';
  try{
    await fetch(API_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({clave:$('clave').value,menu:M})});
    m.textContent='✓ Enviado. Espera 10 segundos y recarga la carta.';
  }catch(e){m.textContent='No se pudo guardar. Revisa la URL de API_URL.'}
};

cargar().then(pintar).catch(e=>$('msg').textContent='No se pudo cargar el menú: '+e.message);
</script></body></html>
